name: FLTK Janet - Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: setup PATH and ENV
        run: |
          echo "$HOME/AppData/Local/Apps/Janet/bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          echo "$HOME/work/fltk-janet/janet/Library/bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh
      - uses: actions/checkout@v4
        with:
          repository: rwtolbert/fltk-janet
          path: fltk-janet
      - uses: actions/checkout@v4
        with:
          repository: janet-lang/janet
          path: janet
      - uses: actions/checkout@v4
        with: 
          repository: janet-lang/spork
          path: spork
      - name: Build janet
        run: |
          cd janet
          ${{ '"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" && build_win.bat dist' }}
          build_win.bat install
          janet.exe -v
        shell: cmd
      - name: Build spork
        run: |
          cd spork
          ../janet/janet --install .
        shell: pwsh
      - name: Build fltk-janet
        run: |
          cd fltk-janet
          janet-pm build
        shell: pwsh
