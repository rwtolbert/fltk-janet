name: FLTK Janet

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: setup PATH
        run: echo "$HOME/janet/bin" >> $GITHUB_PATH && echo "$HOME/janet/lib/janet/bin" >> $GITHUB_PATH
      - name: Install prereqs
        run: sudo apt-get update -y && sudo apt-get install -y git libx11-dev libxft-dev libxft2-dev build-essential libopengl-dev libglut-dev cmake libxinerama-dev libxcursor-dev ninja-build x11-apps
      - uses: actions/checkout@v4
        with:
          repository: rwtolbert/fltk-janet
          path: fltk-janet
      - uses: actions/checkout@v4
        with:
          repository: janet-lang/janet
          path: janet
      - uses: actions/checkout@v4
        with: 
          repository: janet-lang/spork
          path: spork
      - name: Build janet
        run: cd janet && PREFIX=$HOME/janet make install && janet -v
      - name: Build spork
        run: cd spork && janet --install .
      - name: Build fltk-janet
        run: echo "$HOME/janet/bin" >> $GITHUB_PATH && cd fltk-janet && janet-pm build
